<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACKOUT HUNT — VENCEDOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/" } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
    }

    #confetti {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 0;
      padding: 1.5rem 2rem;
    }

    @media (max-width: 640px) {
      html, body { overflow: auto; }
      .page {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem 1rem;
        gap: 1rem;
      }
      #card3d { order: -1; }
    }

    /* LEFT SIDE */
    .left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.6rem;
      padding-right: 2rem;
    }

    .logo-img {
      max-width: min(260px, 80%);
      height: auto;
      filter: drop-shadow(0 0 15px rgba(170,255,0,0.4));
      margin-bottom: 0.5rem;
    }

    .winner-badge {
      display: inline-block;
      background: #aaff00;
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      padding: 0.3rem 1rem;
      border-radius: 2px;
      width: fit-content;
      animation: badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }

    @keyframes badgePop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      letter-spacing: 0.04em;
      color: #aaff00;
      line-height: 1;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(170,255,0,0.5)); }
      50%       { filter: drop-shadow(0 0 35px rgba(170,255,0,0.9)); }
    }

    .winner-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.5rem);
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .winner-insta {
      font-size: 0.9rem;
      color: #aaff00;
    }

    .winner-time {
      font-size: 0.75rem;
      color: #555;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #444;
      line-height: 1.7;
      max-width: 340px;
    }

    .btn-back {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.6rem 1.5rem;
      border: 1px solid #aaff00;
      background: transparent;
      color: #aaff00;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      width: fit-content;
      transition: background 0.15s;
      margin-top: 0.4rem;
    }

    .btn-back:hover { background: rgba(170,255,0,0.1); }

    /* RIGHT SIDE — 3D */
    .right {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #card3d {
      width: min(420px, 45vw);
      height: min(420px, 45vw);
    }

    @media (max-width: 640px) {
      #card3d { width: 80vw; height: 80vw; }
      .left { padding-right: 0; align-items: center; }
      .winner-badge, .btn-back, .subtitle { align-self: center; }
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="page">
  <!-- LEFT -->
  <div class="left">
    <img src="/HUNT.png" alt="BLACKOUT HUNT" class="logo-img" />
    <div class="winner-badge">🏆 PRIMEIRO LUGAR</div>
    <h1>VOCÊ<br>VENCEU!</h1>
    <div class="winner-name" id="winnerName">—</div>
    <div class="winner-insta" id="winnerInsta"></div>
    <div class="winner-time" id="winnerTime"></div>
    <p class="subtitle">Você foi o primeiro a completar todos os 4 checkpoints. O prêmio é seu. Parabéns!</p>
    <a href="/" class="btn-back">← Ver Ranking</a>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <canvas id="card3d"></canvas>
  </div>
</div>

<!-- THREE.JS -->
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('card3d');
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(0, 0, 3);

  scene.add(new THREE.AmbientLight(0xffffff, 1.5));
  const dir = new THREE.DirectionalLight(0xaaff00, 2.5);
  dir.position.set(2, 3, 2);
  scene.add(dir);
  const rim = new THREE.DirectionalLight(0xffffff, 1);
  rim.position.set(-2, -1, -2);
  scene.add(rim);

  const controls = new OrbitControls(camera, canvas);
  controls.enableZoom = false;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 3;
  controls.minPolarAngle = Math.PI / 3;
  controls.maxPolarAngle = Math.PI / 1.5;

  const loader = new GLTFLoader();
  loader.load('/assets/card3d.gltf', (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(center);
    camera.position.z = Math.max(size.x, size.y, size.z) * 2;
    scene.add(model);

    let t = 0;
    (function animate() {
      requestAnimationFrame(animate);
      t += 0.01;
      model.position.y = Math.sin(t) * 0.06;
      controls.update();
      renderer.render(scene, camera);
    })();
  }, undefined, (err) => console.error('GLTF:', err));
</script>

<!-- CONFETTI -->
<script>
(function() {
  const c = document.getElementById('confetti');
  const ctx = c.getContext('2d');
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#aaff00','#ccff00','#ffffff','#ffd700','#00ffcc'];
  const pieces = Array.from({ length: 100 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight - window.innerHeight,
    w: Math.random() * 10 + 4,
    h: Math.random() * 5 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    speed: Math.random() * 2.5 + 0.8,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.12,
    drift: (Math.random() - 0.5) * 1.2,
  }));

  (function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.y += p.speed; p.x += p.drift; p.angle += p.spin;
      if (p.y > c.height) { p.y = -10; p.x = Math.random() * c.width; }
    });
    requestAnimationFrame(draw);
  })();
})();
</script>

<!-- WINNER DATA -->
<script>
(async function() {
  function formatMs(ms) {
    if (!ms) return '';
    const cs = Math.floor(ms/10)%100, s = Math.floor(ms/1000)%60, m = Math.floor(ms/60000);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  }
  try {
    const data = await (await fetch('/ranking')).json();
    const w = data.ranking.find(u => u.is_winner);
    if (w) {
      document.getElementById('winnerName').textContent = w.name;
      document.getElementById('winnerInsta').textContent = w.instagram || '';
      document.getElementById('winnerTime').textContent = `Tempo total: ${w.total_time_formatted}`;
    }
  } catch(e) {}
})();
</script>

</body>
</html>
