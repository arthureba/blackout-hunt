<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACKOUT HUNT — VENCEDOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/" } }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
      overflow: hidden;
    }

    .glow-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 55% at 50% 52%, rgba(170,255,0,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 30% 20% at 50% 52%, rgba(255,215,0,0.06) 0%, transparent 50%);
    }

    .page {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding-top: max(env(safe-area-inset-top), 0.7rem);
      padding-bottom: max(env(safe-area-inset-bottom), 0.7rem);
      padding-left: 1rem; padding-right: 1rem;
    }

    .logo-img {
      max-width: 140px; width: 35vw; height: auto; flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(170,255,0,0.4));
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 12vw, 4rem);
      letter-spacing: 0.05em; color: #aaff00;
      line-height: 1; text-align: center; flex-shrink: 0;
      animation: glowPulse 2.5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 18px rgba(170,255,0,0.5); }
      50%       { text-shadow: 0 0 40px rgba(170,255,0,0.95), 0 0 80px rgba(170,255,0,0.3); }
    }

    #card3d {
      flex: 1; display: block;
      width: min(220px, 58vw);
      min-height: 0;
    }

    .bottom-info { text-align: center; flex-shrink: 0; }

    .winner-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.3rem, 6vw, 2rem);
      color: #fff; letter-spacing: 0.04em; line-height: 1.1;
    }
    .winner-insta { font-size: 0.8rem; color: #aaff00; margin-top: 0.1rem; }
    .winner-time  { font-size: 0.65rem; color: #555; margin-top: 0.1rem; margin-bottom: 0.5rem; }
    .subtitle     { font-size: 0.65rem; color: #444; line-height: 1.6; margin-bottom: 0.5rem; }

    .btn-back {
      display: inline-block;
      font-family: 'Space Mono', monospace; font-size: 0.65rem;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      padding: 0.45rem 1.2rem; border: 1px solid #333;
      background: transparent; color: #555; border-radius: 4px;
      text-decoration: none; transition: all 0.15s;
    }
    .btn-back:hover { border-color: #aaff00; color: #aaff00; }

    @media (min-width: 700px) and (min-height: 500px) {
      .page { flex-direction: row; justify-content: center; align-items: center; gap: 4rem; padding: 2rem 4rem; }
      .left-col { display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem; flex: 1; max-width: 340px; }
      .logo-img { max-width: 200px; width: 18vw; }
      h1 { font-size: clamp(3rem, 6.5vw, 5rem); text-align: left; }
      .right-col { flex-shrink: 0; }
      #card3d { width: min(300px, 34vw); flex: unset; }
      .bottom-info { text-align: left; }
    }
  </style>
</head>
<body>

<div class="glow-bg"></div>

<div class="page" id="page">
  <img src="/HUNT.png" alt="BLACKOUT HUNT" class="logo-img" id="logoEl" />
  <h1 id="titleEl">VOCÊ<br>VENCEU!</h1>
  <canvas id="card3d"></canvas>
  <div class="bottom-info">
    <div class="winner-name" id="winnerName">—</div>
    <div class="winner-insta" id="winnerInsta"></div>
    <div class="winner-time" id="winnerTime"></div>
    <p class="subtitle">Primeiro a completar os 4 checkpoints.<br>O prêmio é seu!</p>
    <a href="/" class="btn-back">← Ver Ranking</a>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('card3d');
  function sz() { const r = canvas.getBoundingClientRect(); return { w: r.width || 300, h: r.height || 300 }; }
  const { w, h } = sz();

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1)); // cap em 1 = maior ganho mobile
  renderer.setSize(w, h);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.8;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);

  // 3 luzes — ambiente + key verde + neon point
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));

  const key = new THREE.DirectionalLight(0xccff44, 3.5);
  key.position.set(2, 3, 3);
  scene.add(key);

  const neon = new THREE.PointLight(0xaaff00, 7, 8);
  neon.position.set(0, 0, 2.5);
  scene.add(neon);

  const controls = new OrbitControls(camera, canvas);
  controls.enableZoom = false;
  controls.enablePan  = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 2.5;
  // Trava rotação vertical — só gira de lado pra lado
  controls.minPolarAngle = Math.PI / 2.8;
  controls.maxPolarAngle = Math.PI / 2.8;

  new GLTFLoader().load('/assets/card3d.gltf', (gltf) => {
    const model = gltf.scene;
    model.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.envMapIntensity = 1.5;
        child.material.needsUpdate = true;
      }
    });

    const box  = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size   = box.getSize(new THREE.Vector3());
    model.position.sub(center); // anchor no centro
    camera.position.z = Math.max(size.x, size.y, size.z) * 3.0;
    scene.add(model);

    let t = 0;
    const MS = 1000 / 30; // 30fps — suave e econômico
    let last = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      if (now - last < MS) return;
      last = now;
      t += 0.02;

      model.position.y = Math.sin(t) * 0.07;
      neon.intensity    = 6 + Math.sin(t * 1.8) * 2;

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  }, undefined, (e) => console.error('GLTF:', e));

  window.addEventListener('resize', () => {
    const { w, h } = sz();
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
</script>

<!-- WINNER DATA -->
<script>
(async function() {
  try {
    const data = await (await fetch('/ranking')).json();
    const w = data.ranking.find(u => u.is_winner);
    if (w) {
      document.getElementById('winnerName').textContent = w.name;
      if (w.instagram) document.getElementById('winnerInsta').textContent = w.instagram;
      document.getElementById('winnerTime').textContent = 'Tempo total: ' + w.total_time_formatted;
    }
  } catch(e) {}
})();
</script>

<!-- DESKTOP REARRANGE -->
<script>
  if (window.innerWidth >= 700) {
    const page   = document.getElementById('page');
    const logo   = document.getElementById('logoEl');
    const title  = document.getElementById('titleEl');
    const card   = document.getElementById('card3d');
    const bottom = document.querySelector('.bottom-info');
    const left   = document.createElement('div'); left.className = 'left-col';
    const right  = document.createElement('div'); right.className = 'right-col';
    left.append(logo, title, bottom);
    right.append(card);
    page.innerHTML = '';
    page.append(left, right);
  }
</script>

</body>
</html>
