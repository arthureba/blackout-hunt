<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACKOUT HUNT — VENCEDOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      background: #080808;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      color: #e0e0e0;
    }

    /* ── ARC CONTAINER ── */
    #arc {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .arc-photo {
      position: absolute;
      top: 0; left: 0;
      width: 92px; height: 120px;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      will-change: transform, opacity;
      transition: opacity 0.3s;
    }

    .arc-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── CONTEÚDO CENTRAL ── */
    .center {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: max(env(safe-area-inset-top), 1rem) 2rem max(env(safe-area-inset-bottom), 1rem);
      text-align: center;
      pointer-events: none;
    }

    .logo-img {
      width: min(150px, 38vw);
      height: auto;
      filter: drop-shadow(0 0 12px rgba(170,255,0,0.45));
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 16vw, 5.5rem);
      letter-spacing: 0.05em;
      color: #aaff00;
      line-height: 1;
      animation: glowPulse 2.5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px rgba(170,255,0,0.55); }
      50%       { text-shadow: 0 0 45px rgba(170,255,0,1), 0 0 90px rgba(170,255,0,0.35); }
    }

    .divider {
      width: 40px; height: 1px;
      background: #333;
      margin: 0.25rem 0;
    }

    .winner-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.4rem, 7vw, 2.2rem);
      color: #fff;
      letter-spacing: 0.06em;
      line-height: 1.1;
    }

    .winner-insta {
      font-size: 0.8rem;
      color: #aaff00;
      letter-spacing: 0.03em;
    }

    .winner-time {
      font-size: 0.62rem;
      color: #444;
      margin-top: -0.15rem;
    }

    .btn-back {
      pointer-events: all;
      display: inline-block;
      margin-top: 0.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.5rem 1.4rem;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #555;
      border-radius: 4px;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-back:hover { border-color: #aaff00; color: #aaff00; }
  </style>
</head>
<body>

<!-- Arco de fotos -->
<div id="arc"></div>

<!-- Conteúdo central -->
<div class="center">
  <img src="/HUNT.png" alt="BLACKOUT HUNT" class="logo-img" />
  <h1>VOCÊ VENCEU!</h1>
  <div class="divider"></div>
  <div class="winner-name" id="winnerName">—</div>
  <div class="winner-insta" id="winnerInsta"></div>
  <div class="winner-time"  id="winnerTime"></div>
  <a href="/" class="btn-back">← Retornar ao Ranking</a>
</div>

<!-- WINNER DATA -->
<script>
(async function() {
  try {
    const data = await (await fetch('/ranking')).json();
    const w = data.ranking.find(u => u.is_winner);
    if (w) {
      document.getElementById('winnerName').textContent = w.name;
      if (w.instagram) document.getElementById('winnerInsta').textContent = w.instagram;
      document.getElementById('winnerTime').textContent = 'Tempo total: ' + w.total_time_formatted;
    }
  } catch(e) {}
})();
</script>

<!-- ARCO DE FOTOS -->
<script>
(function() {
  const PHOTOS = [
    '/assets/photos/p1.jpg',  '/assets/photos/p2.jpg',
    '/assets/photos/p3.jpg',  '/assets/photos/p4.jpg',
    '/assets/photos/p5.jpg',  '/assets/photos/p6.jpg',
    '/assets/photos/p7.jpg',  '/assets/photos/p8.jpg',
    '/assets/photos/p9.jpg',  '/assets/photos/p10.jpg',
    '/assets/photos/p11.jpg', '/assets/photos/p12.jpg',
    '/assets/photos/p13.jpg', '/assets/photos/p14.jpg',
    '/assets/photos/p15.jpg', '/assets/photos/p16.jpg',
  ];

  const container = document.getElementById('arc');
  const PW = 92, PH = 120; // photo card dimensions

  // Cria elementos de foto
  const els = PHOTOS.map(src => {
    const div = document.createElement('div');
    div.className = 'arc-photo';
    const img = document.createElement('img');
    img.src = src; img.alt = ''; img.draggable = false;
    div.appendChild(img);
    container.appendChild(div);
    return div;
  });

  const N = els.length;
  let offset = 0;
  let last = 0;
  const MS = 1000 / 30; // 30fps

  // Ângulos em graus (estilo relógio: 0=topo, 90=direita, 180=baixo, 270=esquerda)
  const GAP_CENTER = 180;  // gap no centro-baixo
  const GAP_HALF   = 38;   // metade do gap em graus (~76° total)
  const ARC_DEG    = 360 - GAP_HALF * 2; // ~284° de arco visível
  const ARC_START  = GAP_CENTER + GAP_HALF; // onde o arco começa (sentido horário)

  function render(now) {
    requestAnimationFrame(render);
    if (now - last < MS) return;
    last = now;

    offset = (offset + 0.00022) % 1; // velocidade de rotação

    const W = window.innerWidth;
    const H = window.innerHeight;
    const CX = W / 2;
    const CY = H * 0.44;
    const RX = Math.min(W * 0.56, 340);
    const RY = Math.min(H * 0.50, 400);

    els.forEach((el, i) => {
      // t = posição normalizada [0,1] de cada foto ao longo do arco
      const t = ((i / N) + offset) % 1;

      // Ângulo no arco (graus, estilo relógio)
      const angleDeg = (ARC_START + t * ARC_DEG) % 360;

      // Converter para radianos cartesianos (0=direita, anti-horário, y invertido)
      const rad = (angleDeg - 90) * Math.PI / 180;

      const x = CX + RX * Math.cos(rad);
      const y = CY + RY * Math.sin(rad);

      // Escala: maior no topo (angleDeg≈0), menor nas bordas
      const distFromTop = Math.min(angleDeg, 360 - angleDeg) / 180;
      const scale = 0.62 + 0.38 * (1 - distFromTop);

      // Leve rotação seguindo a tangente do arco
      const tilt = (angleDeg - 90) * 0.12;

      // Fade nas extremidades do arco (perto do gap)
      const distFromGapL = Math.abs(((angleDeg - (GAP_CENTER - GAP_HALF) + 360) % 360));
      const distFromGapR = Math.abs(((angleDeg - (GAP_CENTER + GAP_HALF) + 360) % 360));
      const minDist = Math.min(distFromGapL, distFromGapR);
      const opacity  = Math.min(minDist / 28, 1);

      el.style.transform = `translate(${x - PW/2}px, ${y - PH/2}px) rotate(${tilt}deg) scale(${scale})`;
      el.style.opacity = opacity;
    });
  }

  requestAnimationFrame(render);
})();
</script>

</body>
</html>
