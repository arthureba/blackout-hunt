<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACKOUT HUNT — VENCEDOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Space Mono', monospace;
      overflow: hidden;
    }

    /* CONFETTI */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* SPOTLIGHT BG — foco no centro */
    .glow-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 55% 55% at 50% 52%, rgba(170,255,0,0.13) 0%, rgba(170,255,0,0.04) 35%, transparent 70%),
        radial-gradient(ellipse 30% 20% at 50% 52%, rgba(255,215,0,0.10) 0%, transparent 50%);
      pointer-events: none;
    }

    /* LAYOUT */
    .page {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-top: max(env(safe-area-inset-top), 0.7rem);
      padding-bottom: max(env(safe-area-inset-bottom), 0.7rem);
      padding-left: 1rem;
      padding-right: 1rem;
    }

    /* TOP ROW — logo + título */
    .top-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      flex-shrink: 0;
    }

    .logo-img {
      max-width: 140px;
      width: 35vw;
      height: auto;
      filter: drop-shadow(0 0 8px rgba(170,255,0,0.4));
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 12vw, 4rem);
      letter-spacing: 0.05em;
      color: #aaff00;
      line-height: 1;
      text-align: center;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 18px rgba(170,255,0,0.5), 0 0 50px rgba(170,255,0,0.15); }
      50%       { text-shadow: 0 0 35px rgba(170,255,0,0.9), 0 0 90px rgba(170,255,0,0.4); }
    }

    /* CARD VIDEO — ESTRELA */
    .card-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      width: 100%;
    }

    #cardVideo {
      display: block;
      width: min(340px, 84vw);
      height: auto;
      border-radius: 12px;
      animation: cardGlow 2s ease-in-out infinite;
    }

    @keyframes cardGlow {
      0%, 100% { filter: drop-shadow(0 0 25px rgba(170,255,0,0.35)) drop-shadow(0 0 50px rgba(255,215,0,0.15)); }
      50%       { filter: drop-shadow(0 0 55px rgba(170,255,0,0.7))  drop-shadow(0 0 100px rgba(255,215,0,0.3)); }
    }

    /* BOTTOM INFO */
    .bottom-info {
      text-align: center;
      flex-shrink: 0;
    }

    .winner-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.3rem, 6vw, 2rem);
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .winner-insta {
      font-size: 0.8rem;
      color: #aaff00;
      margin-top: 0.1rem;
    }

    .winner-time {
      font-size: 0.65rem;
      color: #555;
      margin-top: 0.1rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.65rem;
      color: #444;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .btn-back {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.45rem 1.2rem;
      border: 1px solid #333;
      background: transparent;
      color: #555;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.15s;
    }

    .btn-back:hover { border-color: #aaff00; color: #aaff00; }

    /* DESKTOP */
    @media (min-width: 700px) and (min-height: 500px) {
      .page {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 4rem;
        padding: 2rem 4rem;
      }

      .left-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.6rem;
        flex: 1;
        max-width: 340px;
      }

      .logo-img { max-width: 200px; width: 18vw; }

      h1 {
        font-size: clamp(3rem, 6.5vw, 5rem);
        text-align: left;
      }

      .right-col { flex-shrink: 0; }

      #cardVideo {
        width: min(420px, 44vw);
      }

      .bottom-info { text-align: left; }
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>
<div class="glow-bg"></div>

<div class="page" id="page">
  <img src="/HUNT.png" alt="BLACKOUT HUNT" class="logo-img" id="logoEl" />

  <h1 id="titleEl">VOCÊ<br>VENCEU!</h1>

  <div class="card-wrap" id="cardWrap">
    <video id="cardVideo" src="/assets/card-video.mp4"
      autoplay loop muted playsinline preload="auto"></video>
  </div>

  <div class="bottom-info">
    <div class="winner-name" id="winnerName">—</div>
    <div class="winner-insta" id="winnerInsta"></div>
    <div class="winner-time" id="winnerTime"></div>
    <p class="subtitle">Primeiro a completar os 4 checkpoints.<br>O prêmio é seu!</p>
    <a href="/" class="btn-back">← Ver Ranking</a>
  </div>
</div>


<!-- CONFETTI -->
<script>
(function() {
  const c = document.getElementById('confetti');
  const ctx = c.getContext('2d');
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#aaff00','#ccff00','#ffffff','#ffd700','#00ffcc','#ffee00','#aaffaa'];
  const pieces = Array.from({ length: 160 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight - window.innerHeight,
    w: Math.random() * 12 + 4,
    h: Math.random() * 6 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    speed: Math.random() * 3 + 0.8,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.14,
    drift: (Math.random() - 0.5) * 1.5,
    opacity: Math.random() * 0.45 + 0.5,
  }));

  (function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.opacity;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.y += p.speed; p.x += p.drift; p.angle += p.spin;
      if (p.y > c.height) { p.y = -12; p.x = Math.random() * c.width; }
    });
    requestAnimationFrame(draw);
  })();
})();
</script>

<!-- WINNER DATA -->
<script>
(async function() {
  try {
    const data = await (await fetch('/ranking')).json();
    const w = data.ranking.find(u => u.is_winner);
    if (w) {
      document.getElementById('winnerName').textContent = w.name;
      if (w.instagram) document.getElementById('winnerInsta').textContent = w.instagram;
      document.getElementById('winnerTime').textContent = 'Tempo total: ' + w.total_time_formatted;
    }
  } catch(e) {}
})();
</script>

<!-- DESKTOP REARRANGE -->
<script>
  if (window.innerWidth >= 700) {
    const page = document.getElementById('page');
    const logo = document.getElementById('logoEl');
    const title = document.getElementById('titleEl');
    const wrap = document.getElementById('cardWrap');
    const bottom = document.querySelector('.bottom-info');

    const left = document.createElement('div');
    left.className = 'left-col';
    left.append(logo, title, bottom);

    const right = document.createElement('div');
    right.className = 'right-col';
    right.append(wrap);

    page.innerHTML = '';
    page.append(left, right);
  }
</script>

</body>
</html>
